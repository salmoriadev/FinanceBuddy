name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: API tests
        run: npm run test:api

      - name: Web tests
        run: npm run test:web

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: API build
        run: npm run build:api

      - name: Web build
        run: npm run build:web
